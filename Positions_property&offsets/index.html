<!DOCTYPE html>
<html>
<head>
    <title>My Workspace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h2>My Workspace</h2>
        <span>9:30 AM</span>
    </header>

    <main>

        <section class="welcome">
            <h1>Welcome back, Sanika</h1>
            <p>Here's what you're working on today.</p>
        </section>

        <section class="dashboard">

            <div class="task-card">
                <span class="task-count">3 Tasks</span>
                <h2>Today's Tasks</h2>

                <p>HTML</p>
                <p>CSS</p>
                <p>JavaScript</p>
            </div>

            <div class="notes-card">
                <h2>Quick Notes</h2>

                <p>Learn CSS</p>
                <p>Practice Flexbox</p>

                <button>Save</button>
            </div>

        </section>

        <section class="projects">

            <h2>Recent Projects</h2>

            <div class="project-container">

                <div class="project-card">
                    <h3>Website</h3>
                    <p>HTML & CSS</p>
                </div>

                <div class="project-card">
                    <h3>Dashboard</h3>
                    <p>Flexbox & Grid</p>
                </div>

                <div class="project-card">
                    <h3>Profile</h3>
                    <p>HTML & CSS</p>
                </div>

            </div>

        </section>

        <section class="progress">
            <h2>Today's Progress</h2>

            <div class="progress-track">
                <div class="progress-dot"></div>
            </div>
        </section>
    
    </main>

    <button class="new-task">+ New Task</button>

</body>
</html>
